{% extends "base.html" %}
{% block title %}Transfer{% endblock %}
{% block page_title %}Transfer money{% endblock %}
{% block content %}
<div style="max-width:480px">
  <div class="card">
    <form method="post" action="/transactions/transfer">
      <div class="form-group">
        <label class="form-label">Transfer type</label>
        <select name="transfer_type" id="transfer-type" class="form-control" onchange="updateForm()">
          <option value="account">Between accounts (bank to bank)</option>
          <option value="cc_payment">Pay credit card bill</option>
          <option value="bucket">Between buckets (reallocation)</option>
        </select>
      </div>
      <div class="grid grid-2">
        <div class="form-group">
          <label class="form-label" id="from-label">From account</label>
          <select name="from_id" id="from-select" class="form-control" required>
            {% for a in accounts %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" id="to-label">To account</label>
          <select name="to_id" id="to-select" class="form-control" required>
            {% for a in accounts %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}
          </select>
        </div>
      </div>
      <div class="grid grid-2">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" name="date" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Amount ($)</label>
          <input type="number" name="amount" step="0.01" class="form-control" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Note (optional)</label>
        <input type="text" name="note" class="form-control">
      </div>
      <div class="flex gap-8 mt-16">
        <button type="submit" class="btn btn-primary">Complete transfer</button>
        <a href="/transactions/" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const accounts = {{ accounts | tojson }};
const buckets  = {{ buckets  | tojson }};
document.querySelector('input[name="date"]').value = new Date().toISOString().split('T')[0];

function updateForm() {
  const type = document.getElementById('transfer-type').value;
  const fromSel = document.getElementById('from-select');
  const toSel   = document.getElementById('to-select');
  const fromLbl = document.getElementById('from-label');
  const toLbl   = document.getElementById('to-label');
  const items   = type === 'bucket' ? buckets : accounts;
  const labelFrom = type === 'bucket' ? 'From bucket' : 'From account';
  const labelTo   = type === 'bucket' ? 'To bucket'   : (type === 'cc_payment' ? 'Credit card' : 'To account');
  fromLbl.textContent = labelFrom;
  toLbl.textContent   = labelTo;
  [fromSel, toSel].forEach(sel => {
    sel.innerHTML = items.map(i => `<option value="${i.id}">${i.name}</option>`).join('');
  });
}
</script>
{% endblock %}
