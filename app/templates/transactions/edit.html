{% extends "base.html" %}
{% block title %}Edit transaction{% endblock %}
{% block page_title %}Edit transaction{% endblock %}
{% block content %}
<div style="max-width:560px">
  <div class="card">
    <form method="post" action="/transactions/{{ tx.id }}/edit">
      <div class="form-group">
        <label class="form-label">Merchant</label>
        <input type="text" name="merchant_name" class="form-control" value="{{ tx.merchant_name }}" required>
      </div>
      <div class="grid grid-2">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" name="date" class="form-control" value="{{ tx.date }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Amount ($)</label>
          <input type="number" name="amount" step="0.01" class="form-control" value="{{ tx.amount }}" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <select name="category_id" class="form-control" required>
          {% for parent in categories %}
          <optgroup label="{{ parent.name }}">
            {% for sub in parent.subcategories %}
            <option value="{{ sub.id }}" {% if tx.category_id == sub.id %}selected{% endif %}>{{ sub.name }}</option>
            {% endfor %}
          </optgroup>
          {% endfor %}
        </select>
      </div>
      <div class="grid grid-2">
        <div class="form-group">
          <label class="form-label">Account</label>
          <select name="account_id" class="form-control" required>
            {% for a in accounts %}
            <option value="{{ a.id }}" {% if tx.account_id == a.id %}selected{% endif %}>{{ a.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Bucket</label>
          <select name="bucket_id" class="form-control" required>
            {% for b in buckets %}
            <option value="{{ b.id }}" {% if tx.bucket_id == b.id %}selected{% endif %}>{{ b.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Note</label>
        <input type="text" name="note" class="form-control" value="{{ tx.note or '' }}">
      </div>
      <div class="flex gap-8 mt-16">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="/transactions/" class="btn btn-ghost">Cancel</a>
        <a href="/transactions/{{ tx.id }}/split" class="btn btn-ghost">Split</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
