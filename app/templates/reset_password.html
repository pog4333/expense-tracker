<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password — Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f172a;--bg2:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--accent2:#0ea5e9;--green:#4ade80;--red:#f87171;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--radius:6px}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .box{width:100%;max-width:360px}
    .logo{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--accent);margin-bottom:4px}
    .logo span{color:var(--muted)}
    .tagline{font-size:13px;color:var(--muted);margin-bottom:32px}
    .form-label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .form-control{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:14px;padding:10px 14px;outline:none;transition:border-color .15s}
    .form-control:focus{border-color:var(--accent)}
    .btn{width:100%;padding:10px;border-radius:var(--radius);font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;border:none;background:var(--accent2);color:#fff;margin-top:8px}
    .btn:hover{background:var(--accent)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .success{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:var(--green);padding:12px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:16px}
    .error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red);padding:12px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:16px}
    .back{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--muted);text-decoration:none}
    .back:hover{color:var(--accent)}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">track<span>/expenses</span></div>
    <div class="tagline">Set a new password</div>
    {% if success %}
      <div class="success">✓ Password updated. You can now log in.</div>
      <a href="/login" class="back">← Go to login</a>
    {% elif error %}
      <div class="error">{{ error }}</div>
      <a href="/forgot-password" class="back">Request a new link</a>
    {% else %}
      <form method="post" action="/reset-password" id="reset-form">
        <input type="hidden" name="access_token" id="access-token">
        <div style="margin-bottom:16px">
          <label class="form-label">New password</label>
          <input class="form-control" type="password" name="new_password" id="new-password" required minlength="8" autofocus>
        </div>
        <div style="margin-bottom:16px">
          <label class="form-label">Confirm password</label>
          <input class="form-control" type="password" id="confirm-password" required minlength="8">
        </div>
        <button type="submit" class="btn" id="submit-btn" disabled>Set new password</button>
      </form>
      <a href="/login" class="back">← Back to login</a>
    {% endif %}
  </div>
  <script>
    const hash   = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const token  = params.get('access_token');
    const form   = document.getElementById('reset-form');

    if (token) {
      document.getElementById('access-token').value = token;
    } else if (form) {
      form.innerHTML = '<p style="color:var(--red);font-size:13px">Invalid or expired link. <a href="/forgot-password" style="color:var(--accent)">Request a new one.</a></p>';
    }

    const pw  = document.getElementById('new-password');
    const cpw = document.getElementById('confirm-password');
    const btn = document.getElementById('submit-btn');

    function checkMatch() {
      if (!pw || !cpw || !btn) return;
      const ok = pw.value.length >= 8 && pw.value === cpw.value;
      btn.disabled = !ok;
      cpw.style.borderColor = cpw.value ? (ok ? 'var(--green)' : 'var(--red)') : '';
    }
    if (pw)  pw.addEventListener('input', checkMatch);
    if (cpw) cpw.addEventListener('input', checkMatch);
  </script>
</body>
</html>
